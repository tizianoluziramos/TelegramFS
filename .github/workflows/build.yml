name: Build TelegramFS

on:
  push:
    tags: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: winfsp/winfsp
          ref: v2.1
          path: winfsp

      - uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: eb890efcc08f8daafa202c584e88217a92240222
          path: vcpkg
          fetch-depth: 0

      - run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build.ps1 -WinFspInclude "$env:GITHUB_WORKSPACE\winfsp\inc" -VcpkgRoot $vcpkgRoot

      - run: Compress-Archive -Path build/dist/* -DestinationPath TelegramFS-windows-x64.zip

      - uses: softprops/action-gh-release@v3
        with:
          files: TelegramFS-windows-x64.zip
          fail_on_unmatched_files: true